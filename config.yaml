# Eco-Loop Building Agents - Configuration Template
# 
# This configuration file controls all system parameters including LLM endpoint,
# safety bounds, simulation settings, logging, and fault injection for testing.
#
# Environment variables can override any setting:
#   - LLM_ENDPOINT_URL: Override llm.endpoint_url
#   - LOG_DIR: Override logging.log_dir
#   - IDF_PATH: Override simulation.idf_path
#   - EPW_PATH: Override simulation.epw_path

# LLM Client Configuration
# Controls connection to the Ollama endpoint hosting Qwen2.5-7B-Instruct
llm:
  # Base URL for Ollama API endpoint
  # Default for local: http://localhost:11434
  # For Colab: Update to your ngrok or Colab forwarding URL
  endpoint_url: "https://shoulder-ipod-dpi-minimal.trycloudflare.com"
  
  # Model name to use for inference
  model_name: "qwen2.5:7b"
  
  # Maximum time to wait for LLM response before timeout (seconds)
  timeout_seconds: 30.0
  
  # Maximum number of retry attempts for failed requests
  max_retries: 3
  
  # Base for exponential backoff calculation (wait_time = backoff_base ^ attempt)
  # Example: With base=2, retries wait 2s, 4s, 8s
  backoff_base: 2.0
  
  # Timeout for health check requests (seconds)
  health_check_timeout: 5.0


# Safety Bounds Configuration
# Defines operational limits for HVAC control to ensure occupant comfort
safety:
  # Minimum allowed heating setpoint (°C)
  min_heating_setpoint: 18.0
  
  # Maximum allowed heating setpoint (°C)
  max_heating_setpoint: 22.0
  
  # Minimum allowed cooling setpoint (°C)
  min_cooling_setpoint: 22.0
  
  # Maximum allowed cooling setpoint (°C)
  max_cooling_setpoint: 28.0
  
  # Minimum gap between heating and cooling setpoints (°C)
  # Prevents excessive cycling and ensures proper deadband
  min_deadband: 2.0
  
  # ASHRAE 55 thermal comfort band minimum
  pmv_min: -0.5
  
  # ASHRAE 55 thermal comfort band maximum
  pmv_max: 0.5


# Simulation Configuration
# Defines EnergyPlus model files and decision timing
simulation:
  # Path to IDF (Input Data File) building model
  # Relative to project root or absolute path
  idf_path: "./models/baseline.idf"
  
  # Path to EPW (EnergyPlus Weather) file
  # Relative to project root or absolute path
  epw_path: "./weather/IND_New.Delhi.421820_ISHRAE.epw"
  
  # Hours between control decision cycles
  # Recommended: 1 (hourly decisions)
  decision_interval_hours: 1


# Logging Configuration
# Controls log output format and destination
logging:
  # Directory for log file output
  # Logs are named with timestamps: eco_loop_YYYYMMDD_HHMMSS.jsonl
  log_dir: "./logs"
  
  # Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
  log_level: "INFO"
  
  # Whether to use JSON-lines format (true) or plain text (false)
  # JSON-lines recommended for machine parsing and analysis
  json_format: true


# Fault Injection Configuration (for testing resilience)
# Deliberately introduces failures to validate system recovery mechanisms
fault_injection:
  # Whether fault injection is active
  # Set to true for testing, false for production runs
  enabled: false
  
  # Type of fault to inject:
  #   - timeout: Simulate LLM request timeout
  #   - connection_error: Simulate endpoint unavailability
  #   - malformed_json: Return invalid JSON from LLM
  #   - extreme_values: Inject out-of-bounds control decisions
  fault_type: "timeout"
  
  # Probability of fault per request (0.0 to 1.0)
  # Example: 0.1 means 10% of requests will fail
  fault_rate: 0.1
  
  # Duration for sustained faults (seconds)
  # Used for timeout and connection_error fault types
  fault_duration_seconds: 60.0
